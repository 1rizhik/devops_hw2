name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install requests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/devops_hw1:latest

      - name: Run container
        run: |
          docker run -d --name ml-api -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/devops_hw1:latest
          sleep 5

      - name: Run functional tests from scenario.json
        run: |
          python - <<'PY'
          import json
          import sys
          import requests

          with open('config/scenario.json') as f:
              scenario = json.load(f)

          base_url = 'http://localhost:5000'
          failed = 0

          for tc in scenario['test_cases']:
              url = base_url + tc['endpoint']
              method = tc['method']
              payload = tc.get('payload')

              if method == 'GET':
                  r = requests.get(url)
              else:
                  r = requests.post(url, json=payload)

              print(f"[{tc['name']}] status={r.status_code}")
              if r.status_code != tc['expected_status']:
                  print(f"  FAIL: expected {tc['expected_status']}, got {r.status_code}")
                  failed += 1
                  continue

              if 'expected_body_contains' in tc:
                  body = r.json()
                  for k, v in tc['expected_body_contains'].items():
                      if body.get(k) != v:
                          print(f"  FAIL: {k} != {v}")
                          failed += 1

              if 'expected_prediction' in tc:
                  pred = r.json().get('prediction', [None])[0]
                  if pred != tc['expected_prediction']:
                      print(f"  FAIL: prediction {pred} != {tc['expected_prediction']}")
                      failed += 1

          if failed:
              sys.exit(1)
          print("All functional tests passed")
          PY

      - name: Container logs
        if: always()
        run: docker logs ml-api

      - name: Stop container
        if: always()
        run: docker stop ml-api || true

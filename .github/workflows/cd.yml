name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  functional-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install requests

      - name: Create .env for docker compose
        run: |
          cat > .env <<EOF
          POSTGRES_USER=ml_user
          POSTGRES_PASSWORD=ml_secret_password
          POSTGRES_DB=ml_db
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          EOF

      - name: Start full stack with docker compose
        run: |
          docker compose up -d --build
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:5000/health > /dev/null 2>&1; then
              echo "API is up after ${i}s"
              break
            fi
            echo "Attempt ${i}/30 - not ready yet"
            sleep 1
          done

      - name: Verify API is responding
        run: curl -f http://localhost:5000/health

      - name: Run functional tests from scenario.json
        run: python scripts/run_scenario.py

      - name: Verify predictions in database
        run: |
          docker compose exec -T db psql -U ml_user -d ml_db -c "SELECT * FROM predictions;"

      - name: Container logs
        if: always()
        run: |
          docker compose logs ml-api
          docker compose logs db

      - name: Stop stack
        if: always()
        run: docker compose down -v
